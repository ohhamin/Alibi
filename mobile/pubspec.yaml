name: alibi
description: AI turn-based mystery game.
publish_to: none
version: 0.1.0+1

# build-trigger: round-transition-evidence-art-2026-09-26-v1
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/locations/
    - assets/images/characters/
    - assets/images/evidence/
    - assets/images/ui/
    - assets/images/sheets/
