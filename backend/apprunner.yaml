version: 1.0
runtime: python311

build:
  commands:
    build:
      - pip3 install --no-cache-dir -r requirements.txt

run:
  runtime-version: 3.11
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: ENVIRONMENT
      value: production
    - name: OPENAI_MODEL
      value: gpt-5.6-luna
    - name: OPENAI_TIMEOUT_SECONDS
      value: "30"
    - name: OPENAI_MAX_OUTPUT_TOKENS
      value: "400"
    - name: CORS_ORIGINS
      value: "*"
