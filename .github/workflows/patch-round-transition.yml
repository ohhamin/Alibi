name: Patch round transition UI

on:
  push:
    branches: [master]
    paths:
      - scripts/patch_round_transition.py
      - .github/workflows/patch-round-transition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch game screen
        run: python scripts/patch_round_transition.py
      - name: Remove one-off patch files
        run: |
          rm -f scripts/patch_round_transition.py
          rm -f .github/workflows/patch-round-transition.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/screens/game_screen.dart scripts/patch_round_transition.py .github/workflows/patch-round-transition.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add round-end transition interaction"
          git push origin HEAD:master
