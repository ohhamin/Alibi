name: Apply final flow source patch

on:
  push:
    branches:
      - master
    paths:
      - 'mobile/tool/apply_final_flow_patch.py'
      - 'mobile/tool/fix_final_flow_generated.py'
      - '.github/workflows/apply-final-flow-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch game screen source
        run: |
          python mobile/tool/apply_final_flow_patch.py
          python mobile/tool/fix_final_flow_generated.py
          git diff --check

      - name: Commit patched source
        run: |
          if git diff --quiet -- mobile/lib/screens/game_screen.dart; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/screens/game_screen.dart
          git commit -m 'Apply final voting and ending UI flow'
          git push origin HEAD:master
